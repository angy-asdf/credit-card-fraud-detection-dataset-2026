[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "credit_card_fraud_detection_dataset_2026"
version = "0.0.1"
description = "Deteccion de fraude financiero mediante el kernel de Christoffel-Darboux"
authors = [
  { name = "Andrea Manzanares" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["credit_card_fraud_detection_dataset_2026"]
include = ["pyproject.toml", "credit_card_fraud_detection_dataset_2026/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["credit_card_fraud_detection_dataset_2026"]
force-sort-within-sections = true

